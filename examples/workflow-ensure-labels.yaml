name: Ensure PR-automation labels

# Manual, run-once (or run-whenever) setup for the labels the PR-automation &
# backport workflows depend on. Trigger it from the Actions tab after adding the
# automation to a repo — it creates `00 - Ready for Review`, `00 - Reviewed` and
# the fixed backport labels (`backport-failed`, `do not merge`) with consistent
# colour/description so the helper jobs never fail on a missing label. Safe to
# re-run: it's idempotent.
#
# Fill "Backport branches" to also create per-branch backport label pairs
# (`backport <branch>` + `backported <branch>`) for your release lines, e.g.
# "release/11.1, release/11.2".
#
# Tick "Delete confusable label variants" to also clean up wrong REVIEW labels
# people applied by accident (e.g. `Ready for Review` without the `00 - ` prefix).
# Open PRs carrying the wrong label are migrated to the canonical one before it's
# deleted, so nothing drops out of the review funnel. Backport labels are never
# touched by this.

on:
  workflow_dispatch:
    inputs:
      backport_branches:
        description: 'Backport branches, comma/space-separated (e.g. "release/11.1, release/11.2"). Leave blank to skip.'
        required: false
        default: ''
        type: string
      delete_confusable:
        description: 'Delete confusable review-label variants (migrates open PRs first)'
        required: false
        default: false
        type: boolean

jobs:
  ensure-labels:
    uses: datarobot-oss/github-actions/.github/workflows/ensure-labels.yaml@0.0.15  # bump to the release that includes ensure-labels.yaml
    with:
      backport_branches: ${{ inputs.backport_branches }}
      delete_confusable: ${{ inputs.delete_confusable }}
    permissions:
      issues: write
      pull-requests: write
