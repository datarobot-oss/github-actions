name: Create Release on Merge to Main

# Required labels: none. (Triggers on push to main; tags/releases only.)

on:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: datarobot-oss/github-actions/.github/workflows/create-release-on-merge.yaml@0.0.13  # bump to the release that includes create-release-on-merge.yaml
    permissions:
      contents: write
      pull-requests: read
