name: 'Notify Slack: PR ready for review'

on:
  workflow_call:
    inputs:
      slack_mention:
        description: >-
          Optional Slack mention to prefix the message with, e.g. `@some-team`
          or `<!subteam^S0123ABCD>`. Set it in your own caller; left empty the
          message is posted without a mention. Slack only resolves a literal
          `@name` if a user or user group by that name exists in the receiving
          workspace, so a group handle from another workspace posts as plain text.
        required: false
        default: ''
        type: string
      pr_number:
        description: 'PR number, shown in the Slack message. Usually `github.event.pull_request.number`.'
        required: true
        type: number
      pr_url:
        description: 'PR web URL, linked from the Slack message. Usually `github.event.pull_request.html_url`.'
        required: true
        type: string
      pr_title:
        description: 'PR title, shown in the Slack message. Usually `github.event.pull_request.title`.'
        required: true
        type: string
      pr_author:
        description: 'PR author login, shown in the Slack message. Usually `github.event.pull_request.user.login`.'
        required: true
        type: string
      pr_additions:
        description: 'Lines added, shown as `+N`. Usually `github.event.pull_request.additions`.'
        required: true
        type: number
      pr_deletions:
        description: 'Lines removed, shown as `-N`. Usually `github.event.pull_request.deletions`.'
        required: true
        type: number
      repo_name:
        description: 'Full `owner/repo` name, shown in the Slack message. Usually `github.repository`.'
        required: true
        type: string
    secrets:
      SLACK_WEBHOOK_URL:
        description: >-
          Slack incoming-webhook URL for the channel that receives the
          notification. If empty the Slack step is skipped rather than failed.
        required: true

jobs:
  notify-slack:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Send notification to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_MENTION: ${{ inputs.slack_mention }}
          PR_NR: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_AUTHOR: ${{ inputs.pr_author }}
          PR_ADDITIONS: ${{ inputs.pr_additions }}
          PR_DELETIONS: ${{ inputs.pr_deletions }}
          REPO_NAME: ${{ inputs.repo_name }}
        run: |
          # Build the Slack payload via jq so PR-controlled fields can never
          # break out of JSON string context regardless of their contents.
          PAYLOAD=$(jq -n \
            --arg mention "$SLACK_MENTION" \
            --arg pr_nr "$PR_NR" \
            --arg pr_url "$PR_URL" \
            --arg pr_title "$PR_TITLE" \
            --arg pr_author "$PR_AUTHOR" \
            --arg pr_additions "$PR_ADDITIONS" \
            --arg pr_deletions "$PR_DELETIONS" \
            --arg repo_name "$REPO_NAME" \
            '{
              text: "*Pull Request Ready for Review!*",
              blocks: [{
                type: "section",
                text: {
                  type: "mrkdwn",
                  # An unset mention contributes nothing rather than a stray
                  # ": " prefix, so the default output reads as a clean sentence.
                  text: ((if $mention == "" then "" else $mention + ": " end) + ":rocket: PR by " + $pr_author + " needs a review:\n<" + $pr_url + "|" + $repo_name + "#" + $pr_nr + ": " + $pr_title + "> `+" + $pr_additions + " -" + $pr_deletions + "`")
                }
              }]
            }')

          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is empty; skipping Slack notification" >&2
            exit 0
          fi

          # A Slack hiccup (rate limit, outage, rotated webhook) must not fail
          # the caller's PR check. Retry transient errors, then swallow a final
          # failure with a log line instead of letting -f red-X the job.
          if ! curl -fsS --retry 3 --retry-connrefused \
            -X POST -H 'Content-type: application/json' \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL" >/dev/null; then
            echo "Slack notification failed to send; continuing without failing the job" >&2
          fi
