name: Notify GenAI team on "Ready for review" PRs

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      pr_url:
        required: true
        type: string
      pr_title:
        required: true
        type: string
      pr_author:
        required: true
        type: string
      pr_additions:
        required: true
        type: number
      pr_deletions:
        required: true
        type: number
      repo_name:
        required: true
        type: string
    secrets:
      SLACK_WEBHOOK_URL:
        required: true

jobs:
  notify-slack:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      # Disabled: auto-label PRs by which team is a requested reviewer. Kept here
      # for reference — re-enable by uncommenting and giving the step a real
      # condition (a constant `if: false` is flagged by actionlint, so it was
      # commented out rather than left gated off).
      #
      # - name: Add team-specific labels based on reviewers
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     PR_NR: ${{ inputs.pr_number }}
      #   run: |
      #     # Check if Buzok team is a code reviewer and add label if needed
      #     PR_REVIEWERS=$(gh pr view "$PR_NR" --json reviewRequests --jq '.reviewRequests[].name, .reviewRequests[].slug')
      #     echo "PR Reviewers: $PR_REVIEWERS"
      #
      #     if echo "$PR_REVIEWERS" | grep -E "(datarobot-community/buzok|Buzok)" >/dev/null; then
      #       echo "Buzok team is a reviewer, adding label..."
      #       gh pr edit "$PR_NR" --add-label "Needs Review: GenAI Tooling (Buzok)"
      #     fi
      #
      #     if echo "$PR_REVIEWERS" | grep -E "(datarobot-community/docs|Docs)" >/dev/null; then
      #       echo "Docs team is a reviewer, adding label..."
      #       gh pr edit "$PR_NR" --add-label "Needs Review: Docs"
      #     fi

      - name: Send notification to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PR_NR: ${{ inputs.pr_number }}
          PR_URL: ${{ inputs.pr_url }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_AUTHOR: ${{ inputs.pr_author }}
          PR_ADDITIONS: ${{ inputs.pr_additions }}
          PR_DELETIONS: ${{ inputs.pr_deletions }}
          REPO_NAME: ${{ inputs.repo_name }}
        run: |
          # Build the Slack payload via jq so PR-controlled fields can never
          # break out of JSON string context regardless of their contents.
          PAYLOAD=$(jq -n \
            --arg pr_nr "$PR_NR" \
            --arg pr_url "$PR_URL" \
            --arg pr_title "$PR_TITLE" \
            --arg pr_author "$PR_AUTHOR" \
            --arg pr_additions "$PR_ADDITIONS" \
            --arg pr_deletions "$PR_DELETIONS" \
            --arg repo_name "$REPO_NAME" \
            '{
              text: "*Pull Request Ready for Review!*",
              blocks: [{
                type: "section",
                text: {
                  type: "mrkdwn",
                  text: ("@buzok-team: :rocket: PR by " + $pr_author + " needs a review:\n<" + $pr_url + "|" + $repo_name + "#" + $pr_nr + ": " + $pr_title + "> `+" + $pr_additions + " -" + $pr_deletions + "`")
                }
              }]
            }')

          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is empty; skipping Slack notification" >&2
            exit 0
          fi

          # A Slack hiccup (rate limit, outage, rotated webhook) must not fail
          # the caller's PR check. Retry transient errors, then swallow a final
          # failure with a log line instead of letting -f red-X the job.
          if ! curl -fsS --retry 3 --retry-connrefused \
            -X POST -H 'Content-type: application/json' \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL" >/dev/null; then
            echo "Slack notification failed to send; continuing without failing the job" >&2
          fi
