name: Add Jira Link Comment

on:
  workflow_call:
    inputs:
      pr_title:
        description: >-
          PR title, searched for ticket IDs of the form `[ABC-1234]`. Usually
          `github.event.pull_request.title`.
        required: true
        type: string
      pr_number:
        description: >-
          Number of the PR to comment on. Usually
          `github.event.pull_request.number`.
        required: true
        type: number
      pr_branch:
        description: >-
          Head branch name, used as a fallback source for the ticket ID when the
          title has none (e.g. `user/ABC-1234-something`). Usually
          `github.event.pull_request.head.ref`.
        required: true
        type: string
      jira_base_url:
        description: >-
          Base URL that ticket IDs are appended to, e.g.
          `https://your-org.atlassian.net/browse`. Defaults to DataRobot's
          tenant, so set this to your own if you are not a DataRobot repo,
          otherwise the comment links somewhere your readers cannot open. Set
          it to an empty string to skip the Jira comment entirely.
        required: false
        default: 'https://datarobot.atlassian.net/browse'
        type: string

jobs:
  add-jira-link:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Extract Jira Ticket ID from PR title
        id: extract-ticket
        env:
          PR_TITLE: ${{ inputs.pr_title }}
          PR_BRANCH: ${{ inputs.pr_branch }}
        run: |
          # Extract ticket ID(s) from PR title: [PROJ-12345] or [PROJECT-123]
          # Multiple tickets are joined with commas so the output stays on one line
          TICKET_ID=$(printf '%s' "$PR_TITLE" | grep -oE '\[([A-Z]+-[0-9]+)\]' | tr -d '[]' | paste -sd ',' - || echo "")

          # Fallback: extract from branch name, e.g. user/PROJ-2342-something or PROJ-1234
          if [ -z "$TICKET_ID" ]; then
            TICKET_ID=$(printf '%s' "$PR_BRANCH" | grep -oE '[A-Z]+-[0-9]+' | head -1 || echo "")
          fi

          if [ -n "$TICKET_ID" ]; then
            echo "ticket-id=$TICKET_ID" >> "$GITHUB_OUTPUT"
            echo "has-ticket=true" >> "$GITHUB_OUTPUT"
            echo "Found Jira ticket: $TICKET_ID"
          else
            echo "has-ticket=false" >> "$GITHUB_OUTPUT"
            echo "No Jira ticket found in PR title or branch name"
          fi

      # An empty jira_base_url means the caller has no Jira (or does not want the
      # comment): skip rather than post a link nobody can follow.
      - name: Comment with Jira link
        if: steps.extract-ticket.outputs.has-ticket == 'true' && inputs.jira_base_url != ''
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          TICKET_IDS: ${{ steps.extract-ticket.outputs.ticket-id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          JIRA_BASE_URL: ${{ inputs.jira_base_url }}
        with:
          script: |
            const ticketIds = process.env.TICKET_IDS.split(',').filter(Boolean);
            const issueNumber = Number(process.env.PR_NUMBER);
            // Tolerate a trailing slash so both `.../browse` and `.../browse/`
            // produce one separator instead of an accidental `//`.
            const jiraBaseUrl = process.env.JIRA_BASE_URL.replace(/\/+$/, '');
            const links = ticketIds.map(id => `[${id}](${jiraBaseUrl}/${id})`);
            const header = ticketIds.length === 1 ? '### 🎫 Jira Ticket' : '### 🎫 Jira Tickets';
            const body = ticketIds.length === 1 ? links[0] : links.map(l => `- ${l}`).join('\n');
            const commentBody = `${header}\n\n${body}`;

            // Check if we already commented (paginate so a busy PR with the
            // existing comment on a later page doesn't produce a duplicate)
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            // Optional chaining guards against ghost authors (user: null, from a
            // deleted account) and comments with a null body, either of which
            // would otherwise throw and fail the job.
            const botComment = comments.find(comment =>
              comment.user?.type === 'Bot' &&
              comment.body?.includes('🎫 Jira Ticket')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
              console.log('Updated existing Jira link comment');
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: commentBody
              });
              console.log('Created new Jira link comment');
            }
