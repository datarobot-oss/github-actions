name: Ensure Labels

# Dogfoods the ensure-labels reusable workflow in THIS repo. Downstream repos
# should copy examples/workflow-ensure-labels.yaml instead (it pins @version).
# Manual only — run it from the Actions tab to create/repair the automation labels.

on:
  workflow_dispatch:
    inputs:
      backport_branches:
        description: 'Backport branches, comma/space-separated (e.g. "release/11.1, release/11.2"). Leave blank to skip.'
        required: false
        default: ''
        type: string
      delete_confusable:
        description: 'Delete confusable review-label variants (migrates open PRs first)'
        required: false
        default: false
        type: boolean

jobs:
  ensure-labels:
    uses: ./.github/workflows/ensure-labels.yaml
    with:
      backport_branches: ${{ inputs.backport_branches }}
      delete_confusable: ${{ inputs.delete_confusable }}
    permissions:
      issues: write
      pull-requests: write
