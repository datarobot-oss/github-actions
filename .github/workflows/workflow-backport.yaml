name: Backport

# Trigger wrapper that dogfoods the reusable backport workflow in THIS repo.
# Downstream repos should copy examples/workflow-backport.yaml instead (it pins
# a released @version of the reusable workflow). Kept structurally identical to
# that example so both trigger paths — labels and manual dispatch — are exercised
# here before a release is cut.

on:
  # pull_request_target runs in the base-branch context with write access and
  # secrets, and fires for labels added AFTER merge. Both are needed here.
  #
  # SECURITY: pull_request_target is the trigger behind most Actions
  # secret-exfiltration incidents, and this repo is PUBLIC, so fork PRs can
  # reach it. Three things keep it safe, and all three must hold:
  #   1. `prepare` requires `merged == true`, so an unmerged fork PR never runs.
  #   2. `prepare` additionally requires the head to be a branch in THIS repo
  #      (see the `head.repo.full_name` check below), so a merged fork PR is
  #      still refused rather than trusted.
  #   3. The callee (backport.yaml) checks out with no `ref:`, resolving to the
  #      base branch. It never checks out or executes PR head code.
  # If you ever add `ref: github.event.pull_request.head.*` or any build/install
  # step to the callee, this becomes a full compromise path. Don't.
  pull_request_target:
    types: [closed, labeled]
  # Manual backport of a merged PR onto arbitrary branch(es), no labels needed.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Merged PR number to backport (e.g. 1234)'
        required: true
        type: string
      target_branches:
        description: 'Target branch(es), space-separated (e.g. "release/12.0 release/11.0")'
        required: true
        type: string

jobs:
  # Decide which backport labels this run should act on, then pass that as the
  # korthout label_pattern. On merge (`closed`) we process every `backport
  # <branch>` label present at that moment. On a later `labeled` event we scope
  # korthout to ONLY the triggering label's branch — otherwise korthout
  # reprocesses every backport label on the PR each time a new one is added,
  # re-attempting branches that were already backported (duplicate/failed reruns).
  prepare:
    # Only for MERGED PRs carrying at least one `backport <branch>` label —
    # whether the label was added before merge (fires on `closed`) or after
    # (fires on `labeled`).
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event.action == 'labeled' && startsWith(github.event.label.name, 'backport ')) ||
        (github.event.action == 'closed' && contains(join(github.event.pull_request.labels.*.name, '|'), 'backport '))
      )
    runs-on: ubuntu-latest
    # Only computes a regex string. Declared explicitly so the job never inherits
    # the consuming repo's default token permissions, which may be read+write.
    permissions:
      contents: read
    outputs:
      label_pattern: ${{ steps.pattern.outputs.label_pattern }}
    steps:
      - name: Compute label pattern
        id: pattern
        env:
          ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: |
          if [ "$ACTION" = "labeled" ]; then
            # Restrict to just the triggering label's branch. Escape regex
            # metacharacters that are legal in git branch names (e.g. the dot in
            # release/12.0) so the branch matches literally and nothing else.
            BRANCH=${LABEL_NAME#backport }
            ESCAPED=$(printf '%s' "$BRANCH" | sed 's/[.$+(){}|]/\\&/g')
            echo "label_pattern=^backport (${ESCAPED})\$" >> "$GITHUB_OUTPUT"
          else
            # Merge event: handle every backport label present on the PR at once.
            echo 'label_pattern=^backport ([^ ]+)$' >> "$GITHUB_OUTPUT"
          fi

  backport:
    needs: prepare
    uses: ./.github/workflows/backport.yaml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      label_pattern: ${{ needs.prepare.outputs.label_pattern }}
    secrets:
      # Optional — leave unset to fall back to GITHUB_TOKEN (no CI on backport PR).
      APP_ID: ${{ secrets.BACKPORT_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.BACKPORT_APP_PRIVATE_KEY }}
    permissions:
      contents: write
      pull-requests: write

  # Manual dispatch: backport a merged PR by number onto the given branch(es).
  # fromJSON() converts the string dispatch input to the number the reusable
  # workflow expects.
  backport-manual:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/backport.yaml
    with:
      pr_number: ${{ fromJSON(inputs.pr_number) }}
      target_branches: ${{ inputs.target_branches }}
    secrets:
      APP_ID: ${{ secrets.BACKPORT_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.BACKPORT_APP_PRIVATE_KEY }}
    permissions:
      contents: write
      pull-requests: write
