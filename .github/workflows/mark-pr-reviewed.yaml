name: Mark PR as Reviewed

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number

jobs:
  add-reviewed-label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Add "00 - Reviewed" label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Labels are guaranteed to exist by the ensure-labels workflow, so a
            // failure here is a real problem (perms/config) and should surface as
            // a red check rather than be swallowed.
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.pr_number }},
              labels: ['00 - Reviewed']
            });
