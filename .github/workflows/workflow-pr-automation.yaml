name: PR Automation

# Dogfoods the PR-automation reusable workflows in THIS repo. Downstream repos
# should copy examples/workflow-pr-automation.yaml instead (it pins @version).
# Kept structurally in step with that example — using local `./` refs — so every
# job is exercised here before a release tag is cut.

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [labeled, opened, edited]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  # A PR review was submitted with an "approved" state -> mark it reviewed.
  mark-reviewed:
    if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved'
    uses: ./.github/workflows/mark-pr-reviewed.yaml
    with:
      pr_number: ${{ github.event.pull_request.number }}
    permissions:
      pull-requests: write

  # A "ready for review" label was added -> Slack the team with PR metadata.
  notify-ready-for-review:
    if: github.event_name == 'pull_request' && contains(github.event.label.name, 'ready for review')
    uses: ./.github/workflows/mark-pr-to-review.yaml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      pr_url: ${{ github.event.pull_request.html_url }}
      pr_title: ${{ github.event.pull_request.title }}
      pr_author: ${{ github.event.pull_request.user.login }}
      pr_additions: ${{ github.event.pull_request.additions }}
      pr_deletions: ${{ github.event.pull_request.deletions }}
      repo_name: ${{ github.event.repository.name }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    permissions:
      pull-requests: write

  # A PR was opened or its title/description edited -> add a Jira link comment.
  add-jira-link:
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'edited')
    uses: ./.github/workflows/add-jira-link.yaml
    with:
      pr_title: ${{ github.event.pull_request.title }}
      pr_number: ${{ github.event.pull_request.number }}
      pr_branch: ${{ github.head_ref }}
    permissions:
      pull-requests: write

  # Cron / manual dispatch -> Slack digest of open "ready for review" PRs.
  notify-slack-scheduled:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/notify-slack.yaml
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    permissions:
      contents: read
      # write so the digest can reconcile a missing "00 - Reviewed" label when
      # the event-driven mark-reviewed run was never dispatched.
      pull-requests: write
