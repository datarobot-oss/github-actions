name: Ensure PR-automation labels

# Idempotent setup for the labels this repo's PR-automation & backport workflows
# depend on. Run it once (manually) after wiring up the automation and the repo
# is good to go — the labels exist with consistent colour/description, so the
# helper jobs never fail on a missing label.
#
# Always ensured: the review labels `00 - Ready for Review` / `00 - Reviewed`
# and the two fixed backport labels `backport-failed` / `do not merge`.
#
# Pass `backport_branches` to ALSO create the per-branch backport label pairs
# (`backport <branch>` + `backported <branch>`) for your release lines — these
# vary per repo, so they're opt-in rather than hardcoded.

on:
  workflow_call:
    inputs:
      delete_confusable:
        description: >-
          Destructive cleanup. When true, any label that is a "confusable"
          variant of a canonical review label (e.g. `Ready for Review` vs the
          canonical `00 - Ready for Review`) is removed. Open PRs carrying the
          wrong label are first migrated to the canonical one so they stay in the
          funnel. Backport labels are never touched by this.
        required: false
        default: false
        type: boolean
      backport_branches:
        description: >-
          Optional comma/space-separated release branches to create backport
          labels for (e.g. "release/11.1, release/11.2"). For each, both
          `backport <branch>` (trigger) and `backported <branch>` (applied on
          success) are created.
        required: false
        default: ''
        type: string

jobs:
  ensure-labels:
    runs-on: ubuntu-latest
    permissions:
      # write: create/update/delete repo labels and (during cleanup) add the
      # canonical label to PRs that carried a confusable variant.
      issues: write
      pull-requests: write

    steps:
      - name: Ensure labels exist (and optionally clean up confusable variants)
        uses: actions/github-script@v7
        env:
          # Passed via env (not `${{ }}` string-interpolation into the script)
          # so branch names can never break out of the JS source.
          BACKPORT_BRANCHES: ${{ inputs.backport_branches }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Canonical labels the workflows rely on. The review labels carry a
            // `confusable` regex matching the accidental variants people apply
            // instead (anchored so the two can never match each other). The fixed
            // backport labels have no `confusable` — we ensure they exist but
            // never auto-delete look-alikes for them.
            const CANONICAL = [
              {
                name: '00 - Ready for Review',
                color: '0e8a16',
                description: 'PR is ready for team review — triggers the Slack notification & digest.',
                confusable: /^(\d+\s*-\s*)?ready[ _-]*for[ _-]*review$/i,
              },
              {
                name: '00 - Reviewed',
                color: '5319e7',
                description: 'PR has been approved — excludes it from the ready-for-review digest.',
                confusable: /^(\d+\s*-\s*)?reviewed$/i,
              },
              {
                name: 'backport-failed',
                color: 'd93f0b',
                description: 'A backport cherry-pick hit a conflict and needs manual resolution.',
              },
              {
                name: 'do not merge',
                color: 'b60205',
                description: 'Do not merge yet (e.g. CI has not run on a backport PR).',
              },
            ];

            // Optional per-branch backport labels, generated from the input list.
            const backportBranches = (process.env.BACKPORT_BRANCHES || '')
              .split(/[\s,]+/).map(s => s.trim()).filter(Boolean);
            const backportLabels = backportBranches.flatMap(branch => ([
              { name: `backport ${branch}`,   color: '1d76db', description: `Backport this PR to ${branch}.` },
              { name: `backported ${branch}`, color: '0e8a16', description: `Backported to ${branch}.` },
            ]));

            // Everything we intend to create/keep up to date. De-duplicate by
            // lower-cased name (GitHub label uniqueness is case-insensitive):
            // duplicate input — the same branch listed twice, or two branches
            // whose labels differ only in case — would otherwise queue the same
            // label twice and the second createLabel would 422 "already_exists".
            const desiredLower = new Set();
            const desired = [...CANONICAL, ...backportLabels].filter(l => {
              const key = l.name.toLowerCase();
              if (desiredLower.has(key)) return false;
              desiredLower.add(key);
              return true;
            });

            // Never delete these during cleanup even if a confusable pattern
            // somehow matched — the backport/release flow owns them.
            const PROTECTED = /^(backport\b|backported\b|backport-failed$|do not merge$|release\/)/i;

            const deleteConfusable = ${{ inputs.delete_confusable }};
            const { owner, repo } = context.repo;

            // 1. Snapshot every existing repo label.
            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner, repo, per_page: 100,
            });
            // GitHub treats label names as case-insensitive for uniqueness (but
            // preserves the stored casing). Key the lookup by lowercased name so
            // an existing label like "Do not merge" matches our canonical
            // "do not merge" — otherwise we'd try to create it and hit a
            // 422 "already_exists" collision.
            const byName = new Map(existing.map(l => [l.name.toLowerCase(), l]));

            // 2. Create each desired label, or align its name/colour/description.
            for (const label of desired) {
              const current = byName.get(label.name.toLowerCase());
              if (!current) {
                await github.rest.issues.createLabel({
                  owner, repo, name: label.name, color: label.color, description: label.description,
                });
                core.info(`Created label "${label.name}"`);
              } else if (
                current.name !== label.name ||
                current.color !== label.color ||
                (current.description || '') !== label.description
              ) {
                await github.rest.issues.updateLabel({
                  owner, repo, name: current.name, new_name: label.name,
                  color: label.color, description: label.description,
                });
                core.info(`Updated label "${current.name}" → "${label.name}" (name/colour/description)`);
              } else {
                core.info(`Label "${label.name}" already up to date`);
              }
            }

            // 3. Optional destructive cleanup of confusable review-label variants.
            if (!deleteConfusable) {
              core.info('delete_confusable=false — skipping cleanup of confusable labels.');
              return;
            }

            for (const { name } of existing) {
              if (desiredLower.has(name.toLowerCase())) continue;  // keep anything we manage (incl. just-renamed casing)
              if (PROTECTED.test(name)) continue;                  // never touch backport/release labels
              const canonical = CANONICAL.find(c => c.confusable && c.confusable.test(name));
              if (!canonical) continue;

              core.warning(`Confusable label "${name}" → migrating open PRs to "${canonical.name}", then deleting it.`);

              // Migrate: add the canonical label to every open PR/issue carrying
              // the wrong one, so nothing drops out of the review funnel.
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, state: 'open', labels: name, per_page: 100,
              });
              for (const issue of issues) {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: issue.number, labels: [canonical.name],
                });
                core.info(`  #${issue.number}: added "${canonical.name}"`);
              }

              // Delete the confusable label (removes it from everything at once).
              await github.rest.issues.deleteLabel({ owner, repo, name });
              core.info(`  deleted label "${name}"`);
            }
