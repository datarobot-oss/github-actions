name: Backport merged PR

# Reusable workflow: cherry-pick a merged PR onto one or more target branches.
#
# Triggered by labels of the form `backport <branch>` on a merged PR
# (e.g. `backport release/12.0`). Add several labels to backport to several
# branches at once. The destination is encoded in the label, so there is nothing
# else to configure per-PR.
#
# Two ways to choose the destination:
#   * Labels — `label_pattern` extracts the branch from `backport <branch>` labels
#     on the PR (the default, event-driven flow).
#   * Direct — pass `target_branches` (space-delimited) to backport a merged PR by
#     number onto specific branches with NO labels needed (the manual /
#     workflow_dispatch flow). The two can be combined; korthout backports to the
#     union of both.
#
# Token / CI behaviour:
#   * If the optional APP_ID + APP_PRIVATE_KEY secrets are provided, the backport
#     PR is opened by a GitHub App and CI runs on it automatically.
#   * If they are absent, it falls back to the built-in GITHUB_TOKEN. The backport
#     still happens, but CI will NOT auto-run on the resulting PR (a GITHUB_TOKEN
#     limitation) — push an empty commit or re-open the PR to kick the checks.
#   No change to consuming repos is needed to switch between the two; just add the
#   secrets when the App exists.

on:
  workflow_call:
    inputs:
      pr_number:
        description: "Number of the merged PR to backport."
        required: true
        type: number
      label_pattern:
        description: "Regex whose first capture group is the target branch."
        required: false
        type: string
        default: '^backport ([^ ]+)$'
      target_branches:
        description: "Space-delimited branch(es) to backport onto directly, without labels — for the manual/dispatch flow (e.g. 'release/12.0 release/11.0'). Empty in the label-driven flow."
        required: false
        type: string
        default: ''
    secrets:
      APP_ID:
        description: "GitHub App ID (optional; enables CI on the backport PR)."
        required: false
      APP_PRIVATE_KEY:
        description: "GitHub App private key (optional)."
        required: false

jobs:
  backport:
    name: "Backport"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # Evaluated once so both the `if` and the step can read it without touching
      # the masked secret values directly.
      HAS_APP_CREDS: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        if: env.HAS_APP_CREDS == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Create backport PR(s)
        id: backport
        uses: korthout/backport-action@d07416681cab29bf2661702f925f020aaa962997 # v3.4.1
        with:
          github_token: ${{ steps.app-token.outputs.token || github.token }}
          label_pattern: ${{ inputs.label_pattern }}
          # Direct target(s) for the manual flow; empty ('') in the label flow,
          # where korthout derives the branch from the PR's labels instead.
          target_branches: ${{ inputs.target_branches }}
          # Explicit source PR — required when no pull_request event is in context
          # (workflow_dispatch). Equals the event PR number in the label flow, so
          # this is a no-op there.
          source_pr_number: ${{ inputs.pr_number }}
          pull_title: "[Backport ${target_branch}] ${pull_title}"
          pull_description: |
            Automated backport of #${pull_number} to `${target_branch}`.

            > Cherry-picked by the shared `backport` workflow. Review carefully and
            > confirm CI is green before merging onto the LTS branch.
          # Skip the merge commit itself and cherry-pick the squashed/merged content.
          merge_commits: skip
          # Carry over non-backport labels so context isn't lost on the new PR.
          copy_labels_pattern: '^(?!backport).*$'

      - name: Label & comment with backport result
        if: always() && steps.backport.outcome != 'skipped'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          BY_TARGET: ${{ steps.backport.outputs.was_successful_by_target }}
          CREATED: ${{ steps.backport.outputs.created_pull_numbers }}
          APP_TOKEN_USED: ${{ env.HAS_APP_CREDS }}
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const { owner, repo } = context.repo;
            const prNumber = Number(process.env.PR_NUMBER);
            const byTarget = (process.env.BY_TARGET || '').trim();
            const created = (process.env.CREATED || '').trim();
            const appTokenUsed = process.env.APP_TOKEN_USED === 'true';
            const createdNumbers = created.split(/\s+/).filter(Boolean).map(Number);

            // korthout emits one `branch=true|false` line per target label.
            const succeeded = [];
            const failed = [];
            for (const line of byTarget.split(/\r?\n/).map(l => l.trim()).filter(Boolean)) {
              const idx = line.lastIndexOf('=');
              if (idx === -1) continue;
              const branch = line.slice(0, idx);
              const ok = line.slice(idx + 1) === 'true';
              (ok ? succeeded : failed).push(branch);
            }

            // Keep the trigger label as the record; add a done label per target.
            const labels = succeeded.map(b => `backported ${b}`);
            if (failed.length) labels.push('backport-failed');
            if (labels.length) {
              // addLabels auto-creates labels that don't exist yet.
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels,
              });
            }

            const lines = [];
            if (succeeded.length) {
              const prs = created ? ` (${created.split(/\s+/).map(n => `#${n}`).join(', ')})` : '';
              lines.push(`🍒 **Backported** to: ${succeeded.map(b => `\`${b}\``).join(', ')}${prs}`);
            }
            if (failed.length) {
              lines.push(`⚠️ **Backport failed** for: ${failed.map(b => `\`${b}\``).join(', ')} — likely a merge conflict.`);
              lines.push('');
              lines.push('See the comment above for manual `git cherry-pick` instructions, or run:');
              lines.push('```bash');
              for (const b of failed) {
                lines.push(`git checkout ${b} && git pull`);
                lines.push(`git checkout -b backport/pr-${prNumber}-${b.replace(/[^a-zA-Z0-9._-]/g, '-')}`);
                lines.push(`git cherry-pick <merge_sha>   # use -m 1 for a merge commit`);
                lines.push('');
              }
              lines.push('```');
            }
            if (lines.length) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: lines.join('\n'),
              });
            }

            // When the App token wasn't configured, the backport PRs were opened
            // with GITHUB_TOKEN, so CI did NOT auto-run on them. Block merge and
            // tell the author how to kick the checks manually.
            if (!appTokenUsed && createdNumbers.length) {
              for (const n of createdNumbers) {
                let branch = '<backport-branch>';
                try {
                  const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: n });
                  branch = pr.head.ref;
                } catch (e) {
                  console.log(`Could not read head ref for #${n}: ${e.message}`);
                }
                // addLabels auto-creates the label if it doesn't exist yet.
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: n, labels: ['do not merge'],
                });
                const body = [
                  '⛔ **Do not merge yet — CI has not run on this backport.**',
                  '',
                  'This PR was opened with the built-in `GITHUB_TOKEN`. GitHub does not trigger',
                  'workflows for PRs created by `GITHUB_TOKEN`, so the usual checks have **not** run,',
                  'and the **`do not merge`** label has been applied.',
                  '',
                  '**To run the checks**, push an empty commit to this branch:',
                  '```bash',
                  'git fetch origin',
                  `git checkout ${branch}`,
                  'git commit --allow-empty -m "ci: trigger checks"',
                  'git push',
                  '```',
                  'That fires a `pull_request: synchronize` event, which standard CI runs on.',
                  '(If this repo\'s workflows also run on `reopened`, closing and re-opening the PR works too.)',
                  '',
                  'When the checks pass, remove the **`do not merge`** label and merge.',
                  '',
                  '_To make CI run automatically on future backports, configure the backport GitHub App: see [BACKPORT.md](https://github.com/datarobot-oss/github-actions/blob/main/docs/BACKPORT.md)._',
                ].join('\n');
                await github.rest.issues.createComment({ owner, repo, issue_number: n, body });
              }
            }
