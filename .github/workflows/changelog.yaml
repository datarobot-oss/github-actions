name: Changelog

# PR policy check. Not a reusable workflow and not consumed downstream.
#
# Every pull request must record what changed, because consumers pin this repo
# by tag and the changelog is the only thing telling them whether a bump is
# safe. Two escapes: the `skip-changelog` label for changes with no
# consumer-visible effect, and an automatic pass for bot pull requests
# (Dependabot cannot edit the changelog, and its title already lands in the
# auto-generated release notes).
#
# Lives in its own file rather than in self-test.yaml because it needs the
# `labeled` trigger below, and self-test does not: keeping them separate stops a
# label change from re-running actionlint, the unit tests, and the secret scan.

on:
  pull_request:
    # `labeled` and `unlabeled` on top of the default types. Naming any type at
    # all replaces the defaults, so the first three have to be repeated. Without
    # `labeled` the failure message would be telling contributors to apply a
    # label that cannot re-run the check, leaving it red until the next push.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changelog:
    name: Changelog updated
    # Keyed off the pull request author, not `github.actor`: on a `labeled`
    # event the actor is whoever applied the label. This repo's own automation
    # labels pull requests as `github-actions[bot]`, which would otherwise skip
    # the check on human pull requests and run it on Dependabot's.
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history so the merge-base with the target branch is available.
          fetch-depth: 0
      - name: Require a CHANGELOG.md entry
        env:
          # Via env, not ${{ }} in the script body: a branch name is
          # attacker-controlled on a fork PR and would otherwise be expanded
          # into bash source.
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md was updated."
            exit 0
          fi
          cat >&2 <<'EOF'
          CHANGELOG.md was not updated.

          Add a bullet under "## Unreleased" saying what changed and why a
          consumer would care.

          If this change has no consumer-visible effect (CI-only tweak, typo in a
          comment), apply the `skip-changelog` label to the pull request instead.
          EOF
          exit 1
