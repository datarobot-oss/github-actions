name: Notify GenAI team on "Ready for review" PRs

on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK_URL:
        required: true

jobs:
  notify-slack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Fetch open PRs with ready for review labels
        id: fetch-prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: |
          # Get PRs with any label containing "ready for review" (case-insensitive)
          PRS_JSON=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${REPO_NAME}/pulls?state=open&per_page=100")
          echo "All open PRs (before filtering):"
          echo "$PRS_JSON" | jq -r '.[] | "Title: " + .title + " | Labels: " + ([.labels[].name] | join(", "))'

          # Filter PRS_JSON to only PRs with a label containing 'ready for review' (case-insensitive) and exclude those with "00 - Reviewed" label
          PRS_JSON=$(echo "$PRS_JSON" | jq '[.[] | select(
            (.labels[]?.name | ascii_downcase | test("ready for review")) and
            (.labels | map(.name) | any(. == "00 - Reviewed") | not)
          )]')
          echo "Open PRs after filtering for 'ready for review' label (excluding '00 - Reviewed'):"
          echo "$PRS_JSON" | jq -r '.[] | "Title: " + .title + " | Labels: " + ([.labels[].name] | join(", "))'

          # PR numbers are integers from GitHub, safe to round-trip via output
          PR_NUMBERS=$(echo "$PRS_JSON" | jq -r '.[].number' | tr '\n' ' ')
          echo "pr-numbers=$PR_NUMBERS" >> "$GITHUB_OUTPUT"

      - name: Build PR list excluding approved PRs
        id: build-pr-list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          PR_NUMBERS: ${{ steps.fetch-prs.outputs.pr-numbers }}
        run: |
          # Build a JSON array of PR records — PR-controlled strings (title,
          # author) stay inside JSON the whole way, never touching the shell.
          PR_RECORDS="[]"
          for PR_NUMBER in $PR_NUMBERS; do
            REVIEWS=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${REPO_NAME}/pulls/${PR_NUMBER}/reviews")
            # Take the latest APPROVED/CHANGES_REQUESTED review per reviewer;
            # COMMENTED reviews don't affect approval state so they're excluded.
            # This prevents a stale approval from hiding a PR that needs re-review.
            HAS_APPROVAL=$(echo "$REVIEWS" | jq '
              [ .[] | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED") ]
              | group_by(.user.login)
              | map(sort_by(.submitted_at) | last | .state)
              | any(. == "APPROVED")
            ')

            if [ "$HAS_APPROVAL" = "true" ]; then
              echo "Skipping PR #$PR_NUMBER - already has an approval"
              continue
            fi

            PR_DETAIL=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${REPO_NAME}/pulls/${PR_NUMBER}")
            PR_RECORDS=$(jq -n \
              --argjson existing "$PR_RECORDS" \
              --argjson pr "$PR_DETAIL" \
              '$existing + [{
                number: $pr.number,
                title: $pr.title,
                user: $pr.user.login,
                additions: $pr.additions,
                deletions: $pr.deletions,
                html_url: $pr.html_url
              }]')
            echo "Found PR marked as ready for review: #$PR_NUMBER"
          done

          # Pass the JSON to the next step via env (multiline) — avoids the
          # ${{ steps.X.outputs.Y }} interpolation that would re-expand
          # attacker-controlled fields into bash source.
          {
            echo "PR_RECORDS<<PR_RECORDS_EOF"
            echo "$PR_RECORDS"
            echo "PR_RECORDS_EOF"
          } >> "$GITHUB_ENV"

      - name: Send summary notification to Slack
        if: env.PR_RECORDS != '' && env.PR_RECORDS != '[]'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # jq builds the entire payload; PR-controlled strings stay in JSON.
          PAYLOAD=$(jq -n \
            --argjson prs "$PR_RECORDS" \
            '{
              text: "*Pull Requests Ready for Review Summary*",
              blocks: [{
                type: "section",
                text: {
                  type: "mrkdwn",
                  text: (":clipboard: Here are the open PRs ready for review:\n" +
                    ([$prs[] |
                      "• PR <\(.html_url)|#\(.number): \(.title)> by \(.user) needs a review: `+\(.additions) -\(.deletions)`"
                    ] | join("\n")))
                }
              }]
            }')

          curl -X POST -H 'Content-type: application/json' \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"
