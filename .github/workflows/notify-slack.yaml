name: Notify GenAI team on "Ready for review" PRs

on:
  workflow_call:
    inputs:
      header_icon:
        description: 'Slack emoji name (without colons) to use as the header icon, e.g. "clipboard" or "mega"'
        required: false
        default: 'clipboard'
        type: string
    secrets:
      SLACK_WEBHOOK_URL:
        required: true

jobs:
  notify-slack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # write (not read) so the digest can reconcile a missing "00 - Reviewed"
      # label when the event-driven mark-reviewed run was never dispatched.
      pull-requests: write
      checks: read

    steps:
      - name: Fetch open PRs with ready for review labels
        id: fetch-prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
        run: |
          # Get PRs with any label containing "ready for review" (case-insensitive)
          PRS_JSON=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${REPO_NAME}/pulls?state=open&per_page=100")
          echo "All open PRs (before filtering):"
          echo "$PRS_JSON" | jq -r '.[] | "Title: " + .title + " | Labels: " + ([.labels[].name] | join(", "))'

          # Filter PRS_JSON to only PRs with a label containing 'ready for review' (case-insensitive) and exclude those with "00 - Reviewed" label
          PRS_JSON=$(echo "$PRS_JSON" | jq '[.[] | select(
            (.labels[]?.name | ascii_downcase | test("ready for review")) and
            (.labels | map(.name) | any(. == "00 - Reviewed") | not)
          )]')
          echo "Open PRs after filtering for 'ready for review' label (excluding '00 - Reviewed'):"
          echo "$PRS_JSON" | jq -r '.[] | "Title: " + .title + " | Labels: " + ([.labels[].name] | join(", "))'

          # PR numbers are integers from GitHub, safe to round-trip via output
          PR_NUMBERS=$(echo "$PRS_JSON" | jq -r '.[].number' | tr '\n' ' ')
          echo "pr-numbers=$PR_NUMBERS" >> "$GITHUB_OUTPUT"

      - name: Build PR list excluding approved PRs
        id: build-pr-list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          PR_NUMBERS: ${{ steps.fetch-prs.outputs.pr-numbers }}
        run: |
          # Build a JSON array of PR records — PR-controlled strings (title,
          # author) stay inside JSON the whole way, never touching the shell.
          NOW=$(date -u +%s)
          PR_RECORDS="[]"
          for PR_NUMBER in $PR_NUMBERS; do
            REVIEWS=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${REPO_NAME}/pulls/${PR_NUMBER}/reviews")
            PR_DETAIL=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${REPO_NAME}/pulls/${PR_NUMBER}")

            # Take the latest APPROVED/CHANGES_REQUESTED review per reviewer;
            # COMMENTED reviews don't affect approval state so they're excluded.
            HAS_APPROVAL=$(echo "$REVIEWS" | jq '
              [ .[] | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED") ]
              | group_by(.user.login)
              | map(sort_by(.submitted_at) | last | .state)
              | any(. == "APPROVED")
            ')
            # If a re-review was requested (e.g. after new commits), requested_reviewers
            # will be non-empty — surface the PR again even if an old approval exists.
            HAS_PENDING_REVIEW_REQUEST=$(echo "$PR_DETAIL" | jq '.requested_reviewers | length > 0')

            if [ "$HAS_APPROVAL" = "true" ] && [ "$HAS_PENDING_REVIEW_REQUEST" = "false" ]; then
              # This PR is approved and done, yet it still reached this loop —
              # which means it carries a "ready for review" label and lacks
              # "00 - Reviewed" (the fetch step drops already-reviewed PRs). The
              # event-driven mark-reviewed job must have missed its webhook, so
              # heal the label here. This is the safety net for GitHub silently
              # not dispatching pull_request_review runs.
              echo "PR #$PR_NUMBER approved but unlabeled - reconciling '00 - Reviewed'"
              curl -fsS -X POST \
                -H "Authorization: token $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${REPO_NAME}/issues/${PR_NUMBER}/labels" \
                -d '{"labels":["00 - Reviewed"]}' >/dev/null
              echo "Reconciled '00 - Reviewed' on PR #$PR_NUMBER"
              continue
            fi
            # Find when the "ready for review" label was most recently applied.
            # Issues events API is covered by pull-requests: read — no extra permissions needed.
            LABEL_EVENTS=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${REPO_NAME}/issues/${PR_NUMBER}/events?per_page=100")
            LABELED_AT=$(echo "$LABEL_EVENTS" | jq -r '
              [.[] | select(
                .event == "labeled" and
                (.label.name | ascii_downcase | test("ready for review"))
              )] | last | .created_at // ""
            ')

            HEAD_SHA=$(echo "$PR_DETAIL" | jq -r '.head.sha')
            STATUS=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${REPO_NAME}/commits/${HEAD_SHA}/status" | jq -r '.state')
            case "$STATUS" in
              success)        STATUS_ICON=":green_with_check:" ;;
              failure|error)  STATUS_ICON=":red_with_cross:" ;;
              *)               STATUS_ICON=":yellow_pending:" ;;
            esac

            WAITING=""
            if [ -n "$LABELED_AT" ]; then
              LABELED_EPOCH=$(date -u -d "$LABELED_AT" +%s)
              SECS=$(( NOW - LABELED_EPOCH ))
              DAYS=$(( SECS / 86400 ))
              HOURS=$(( (SECS % 86400) / 3600 ))
              if [ "$DAYS" -gt 0 ]; then
                WAITING=" (waiting ${DAYS}d ${HOURS}h)"
              elif [ "$HOURS" -gt 0 ]; then
                WAITING=" (waiting ${HOURS}h)"
              else
                WAITING=" (waiting <1h)"
              fi
            fi

            PR_RECORDS=$(jq -n \
              --argjson existing "$PR_RECORDS" \
              --argjson pr "$PR_DETAIL" \
              --arg waiting "$WAITING" \
              --arg status_icon "$STATUS_ICON" \
              '$existing + [{
                number: $pr.number,
                title: $pr.title,
                user: $pr.user.login,
                additions: $pr.additions,
                deletions: $pr.deletions,
                html_url: $pr.html_url,
                waiting: $waiting,
                status_icon: $status_icon
              }]')
            echo "Found PR marked as ready for review: #$PR_NUMBER"
          done

          # Pass the JSON to the next step via env (multiline) — avoids the
          # step-output interpolation (the double-brace steps.*.outputs.* form)
          # that would re-expand attacker-controlled fields into bash source.
          {
            echo "PR_RECORDS<<PR_RECORDS_EOF"
            echo "$PR_RECORDS"
            echo "PR_RECORDS_EOF"
          } >> "$GITHUB_ENV"

      - name: Send summary notification to Slack
        if: env.PR_RECORDS != '' && env.PR_RECORDS != '[]'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO_NAME: ${{ github.repository }}
        run: |
          REPO_SHORT="${REPO_NAME##*/}"
          HEADER_ICON="${{ inputs.header_icon }}"
          # jq builds the entire payload; PR-controlled strings stay in JSON.
          PAYLOAD=$(jq -n \
            --argjson prs "$PR_RECORDS" \
            --arg repo "$REPO_NAME" \
            --arg repo_short "$REPO_SHORT" \
            --arg header_icon "$HEADER_ICON" \
            '{
              text: "*Pull Requests Ready for Review Summary*",
              blocks: [{
                type: "section",
                text: {
                  type: "mrkdwn",
                  text: (":\($header_icon): <https://github.com/\($repo)/pulls|\($repo_short)> Here are the open PRs ready for review:\n" +
                    ([$prs[] |
                      "• \(.status_icon) <\(.html_url)|\($repo_short)#\(.number): \(.title)> by \(.user) needs a review:\(.waiting) `+\(.additions) -\(.deletions)`"
                    ] | join("\n")))
                }
              }]
            }')

          curl -fsS -X POST -H 'Content-type: application/json' \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL" >/dev/null
